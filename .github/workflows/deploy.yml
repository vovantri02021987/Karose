name: Deploy KaRose to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      setup_database:
        description: "Chạy prisma db push + db seed (XÓA toàn bộ dữ liệu hiện có). Chỉ dùng lần đầu."
        type: boolean
        default: false

jobs:
  database:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.setup_database }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      - run: npx prisma db seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          ALLOW_SEED_RESET: "true"
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_STAFF_PASSWORD: ${{ secrets.SEED_STAFF_PASSWORD }}

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build & deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Domain production (GitHub repo variable). Để trống thì metadata dùng host của request.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      - name: Set DATABASE_URL secret on the Worker
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set VietQR secrets on the Worker (nếu đã khai báo)
        run: |
          for name in VIETQR_BANK_ID VIETQR_ACCOUNT_NO VIETQR_ACCOUNT_NAME VIETQR_WEBHOOK_SECRET AUTH_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "Bỏ qua $name (chưa có GitHub secret)"
            fi
          done
        env:
          VIETQR_BANK_ID: ${{ secrets.VIETQR_BANK_ID }}
          VIETQR_ACCOUNT_NO: ${{ secrets.VIETQR_ACCOUNT_NO }}
          VIETQR_ACCOUNT_NAME: ${{ secrets.VIETQR_ACCOUNT_NAME }}
          VIETQR_WEBHOOK_SECRET: ${{ secrets.VIETQR_WEBHOOK_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
