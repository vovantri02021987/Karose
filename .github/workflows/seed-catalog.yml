name: Seed catalog
on:
  workflow_dispatch:
    inputs:
      file:
        description: JSON file in prisma/ to run
        default: catalog-seed.json
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node prisma/seed-catalog.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_FILE: ${{ inputs.file }}
